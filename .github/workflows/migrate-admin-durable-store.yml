name: Migrate Admin to Cloudflare Data Store

on:
  push:
    branches:
      - feat/cloudflare-admin-store
    paths:
      - scripts/migrate-admin-durable-store.py
      - scripts/remove-obsolete-github-admin-worker.py
      - .github/workflows/migrate-admin-durable-store.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/cloudflare-admin-store

      - name: Apply Cloudflare data store migration
        run: |
          python scripts/migrate-admin-durable-store.py
          python scripts/remove-obsolete-github-admin-worker.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Verify generated Worker
        run: |
          node --check dist/server/index.js
          ! grep -q "GITHUB_PORTFOLIO_TOKEN" dist/server/index.js
          node -e "const c=require('./dist/server/wrangler.json'); if(!c.durable_objects?.bindings?.some(x=>x.name==='PORTFOLIO_STORE')) process.exit(1)"

      - name: Commit migrated admin storage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/remotePortfolioData.ts src/main.tsx src/pages/AdminPage.tsx src/admin/adminUiCopy.ts scripts/prepare-site-build.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Store portfolio admin content in Cloudflare"
          git push origin feat/cloudflare-admin-store
