name: Add Portfolio AI Agent

on:
  push:
    branches:
      - feat/portfolio-ai-agent
    paths:
      - scripts/add-portfolio-agent.py
      - .github/workflows/add-portfolio-agent.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/portfolio-ai-agent
          fetch-depth: 0

      - name: Apply AI agent integration
        run: python scripts/add-portfolio-agent.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Verify generated Worker
        run: node --check dist/server/index.js

      - name: Commit AI agent integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminPage.tsx src/admin/adminUiCopy.ts src/styles/admin.css scripts/prepare-site-build.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add project AI agent to portfolio admin"
          git push origin HEAD:feat/portfolio-ai-agent
