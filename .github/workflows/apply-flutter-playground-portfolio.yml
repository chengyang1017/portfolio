name: Apply Flutter UI Playground Portfolio

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-flutter-playground-portfolio.py
      - .github/workflows/apply-flutter-playground-portfolio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Apply portfolio integration
        run: python scripts/apply-flutter-playground-portfolio.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Verify integration
        run: |
          grep -q "portfolioSeedExtra.json" scripts/prepare-site-build.mjs
          grep -q "flutter-ui-playground" src/pages/HomePage.tsx
          node --check dist/server/index.js

      - name: Commit integration
        run: |
          git config user.name "portfolio-refresh-bot"
          git config user.email "portfolio-refresh-bot@users.noreply.github.com"
          git add scripts/prepare-site-build.mjs src/pages/HomePage.tsx
          git commit -m "Integrate Flutter UI Playground into live portfolio"
          git push origin main
