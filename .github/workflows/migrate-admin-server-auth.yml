name: Migrate Admin Server Auth

on:
  push:
    branches:
      - main
    paths:
      - scripts/migrate-admin-server-auth.py
      - .github/workflows/migrate-admin-server-auth.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply admin auth migration
        run: python scripts/migrate-admin-server-auth.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Check generated Worker syntax
        run: node --check dist/server/index.js

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminPage.tsx src/pages/AdminTranslationsPage.tsx src/admin/githubPortfolio.ts src/admin/projectTranslationManager.ts scripts/prepare-site-build.mjs
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "Move admin GitHub credentials to Worker"
            git push origin HEAD:main
          fi
