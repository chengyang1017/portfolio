name: Integrate Multilingual Project Editor

on:
  push:
    branches:
      - main
    paths:
      - scripts/integrate-project-locales.py
      - .github/workflows/integrate-project-locales.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply multilingual project editor migration
        run: python scripts/integrate-project-locales.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Check generated Worker syntax
        run: node --check dist/server/index.js

      - name: Commit integrated editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminPage.tsx src/App.tsx src/styles/admin.css
          git diff --cached --quiet && exit 0
          git commit -m "Integrate multilingual editing into project admin"
          git push origin main
