name: Fix Admin Draft Persistence

on:
  push:
    branches:
      - main
    paths:
      - scripts/fix-admin-draft-persistence.py
      - .github/workflows/fix-admin-draft-persistence.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply draft persistence fix
        run: python scripts/fix-admin-draft-persistence.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Verify draft persistence
        run: |
          grep -q "portfolio-admin-draft-v1" src/pages/AdminPage.tsx
          grep -q "saveDrafts" src/pages/AdminPage.tsx
          grep -q "draftAutosaved" src/admin/adminUiCopy.ts

      - name: Commit fix and cleanup
        run: |
          rm -f scripts/fix-admin-draft-persistence.py .github/workflows/fix-admin-draft-persistence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminPage.tsx src/admin/adminUiCopy.ts scripts/fix-admin-draft-persistence.py .github/workflows/fix-admin-draft-persistence.yml
          git commit -m "Persist admin drafts across navigation"
          git push origin HEAD:main
