name: Move Portfolio Agent Sidebar

on:
  push:
    branches:
      - main
    paths:
      - scripts/move-agent-sidebar.py
      - .github/workflows/move-agent-sidebar.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move agent into right sidebar
        run: python scripts/move-agent-sidebar.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Verify generated Worker
        run: node --check dist/server/index.js

      - name: Commit sidebar integration and cleanup
        run: |
          rm -f scripts/move-agent-sidebar.py .github/workflows/move-agent-sidebar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminPage.tsx src/styles/admin.css scripts/move-agent-sidebar.py .github/workflows/move-agent-sidebar.yml
          git commit -m "Move portfolio AI agent to admin sidebar"
          git push origin HEAD:main
