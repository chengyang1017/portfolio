name: Localize Admin UI

on:
  push:
    branches:
      - feat/admin-i18n

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/admin-i18n

      - name: Apply admin UI localization
        run: python scripts/localize-admin-ui.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Check generated Worker syntax
        run: node --check dist/server/index.js

      - name: Commit localized admin UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminPage.tsx src/pages/AdminTranslationsPage.tsx src/styles/admin.css src/styles/admin-translations.css
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Localize admin interface"
            git push origin HEAD:feat/admin-i18n
          fi
