name: Fix Cloudflare Admin Session

on:
  push:
    branches:
      - feat/cloudflare-admin-store
    paths:
      - scripts/fix-cloudflare-admin-session.py
      - .github/workflows/fix-cloudflare-admin-session.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cloudflare-admin-store

      - name: Apply session fix
        run: python scripts/fix-cloudflare-admin-session.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Verify Worker runtime
        run: |
          node --check dist/server/index.js
          grep -q "function handleAdminLogin" dist/server/index.js
          grep -q "function handleAdminSession" dist/server/index.js
          grep -q "PORTFOLIO_STORE" dist/server/index.js
          ! grep -q "GITHUB_PORTFOLIO_TOKEN" dist/server/index.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/prepare-site-build.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Restore admin session handlers for Cloudflare store"
          git push origin feat/cloudflare-admin-store
