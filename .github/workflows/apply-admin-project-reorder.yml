name: Apply admin project reorder

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-admin-project-reorder.mjs
      - .github/workflows/apply-admin-project-reorder.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply drag ordering source patch
        run: node scripts/apply-admin-project-reorder.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminPage.tsx src/styles/admin.css
          git rm scripts/apply-admin-project-reorder.mjs .github/workflows/apply-admin-project-reorder.yml
          git commit -m "Add drag ordering to admin project list"
          git push
