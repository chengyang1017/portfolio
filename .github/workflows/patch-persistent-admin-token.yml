name: Patch Persistent Admin Token

on:
  push:
    branches:
      - fix/persist-admin-token

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix/persist-admin-token

      - name: Apply patch
        run: python scripts/patch-admin-token.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Check generated Worker syntax
        run: node --check dist/server/index.js

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminPage.tsx src/pages/AdminTranslationsPage.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Remember verified admin token"
            git push origin HEAD:fix/persist-admin-token
          fi
