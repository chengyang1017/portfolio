name: Show Newest Projects on Home

on:
  push:
    branches:
      - main
    paths:
      - scripts/show-newest-projects-home.py
      - .github/workflows/show-newest-projects-home.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update home project selection
        run: python scripts/show-newest-projects-home.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Commit homepage fix and cleanup
        run: |
          rm -f scripts/show-newest-projects-home.py .github/workflows/show-newest-projects-home.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/HomePage.tsx scripts/show-newest-projects-home.py .github/workflows/show-newest-projects-home.yml
          git commit -m "Show newest projects on portfolio home"
          git push origin HEAD:main
